<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks - To-Do App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <!-- Header -->
        <div class="header">
            <div class="header-content">
                <h1>To-Do List</h1>
                <p>Stay organized, get things done </p>
            </div>
        </div>

        <!-- Input Section -->
        <div class="input-section">
            <div class="input-wrapper">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Add a new task..."
                >
                <button class="add-btn" id="addBtn">+</button>
            </div>

            <!-- Category Tabs -->
            <div class="category-tabs">

    <button class="category-btn active" data-category="all">
        <span class="category-icon">⌂</span>
        <span>All</span>
    </button>

    <button class="category-btn" data-category="work">
        <span class="category-icon">💼</span>
        <span>Work</span>
    </button>

    <button class="category-btn" data-category="personal">
        <span class="category-icon">👤</span>
        <span>Personal</span>
    </button>

    <button class="category-btn" data-category="health">
        <span class="category-icon">♡</span>
        <span>Health</span>
    </button>

    <button class="category-btn" data-category="other">
        <span class="category-icon">👜</span>
        <span>Other</span>
    </button>

</div>

        <!-- Tasks List -->
        <div class="tasks-container" id="tasksList">
            <div class="empty-state">
                <div class="empty-state-icon">📝</div>
                <p>No tasks yet. Add one to get started!</p>
            </div>
        </div>

        <!-- Progress Section -->
        <div class="progress-section">
            <div class="progress-text" id="progressText">
                You've completed 0 of 0 tasks
            </div>

            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
